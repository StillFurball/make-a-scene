<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belgian Ardennes Circuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<!-- Three.js (ES module) + addons via import map -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="hud" class="panel">
  <div class="tag">LIVE · GOLDEN HOUR</div>
  <h1>Belgian Ardennes Circuit</h1>
  <p>Lembah "Red Water" &amp; tanjakan curam gaya Raidillon</p>
  <div class="cars">
    <div class="car"><i style="background:linear-gradient(90deg,#1fe0ff,#0a2bb8)"></i><b>F-Style Open Wheel Racer</b><span id="spdA">0 km/j</span></div>
    <div class="car"><i style="background:linear-gradient(90deg,#b5121b,#111)"></i><b>LM-Style Endurance Hypercar</b><span id="spdB">0 km/j</span></div>
  </div>
</div>

<div id="hint" class="panel">Seret: putar · Scroll: zoom · Klik kanan: geser</div>

<div id="controls" class="panel">
  <button data-mode="lowangle" class="active">Low-Angle</button>
  <button data-mode="follow">Ikuti Orbit</button>
  <button data-mode="chase">Chase Cam</button>
  <button data-mode="aerial">Udara</button>
  <label>Kecepatan <input id="speed" type="range" min="0.2" max="2" step="0.05" value="1"></label>
  <button id="pause">Jeda</button>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
